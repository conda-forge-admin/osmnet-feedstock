{% set version = "0.2" %}

package:
  name: osmnet
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/o/osmnet/osmnet-{{ version }}.tar.gz
  sha256: 2876f08f19d27448407d04862d557fe256dabadebcf50b94fccc263362c13185

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - requests >=2.9.1
    - pandas >=0.23
    - numpy >=1.10
    - geopandas >=0.11
    - shapely >=1.8

test:
  requires:
    - python {{ python_min }}
  imports:
    - osmnet

about:
  home: https://github.com/UDST/osmnet
  license: AGPL-3.0
  license_family: AGPL
  license_file: LICENSE.txt
  summary: Tools for the extraction of OpenStreetMap street network data for use in Pandana accessibility analyses.
  description: |
    Tools for the extraction of OpenStreetMap (OSM) street network data.
    Intended to be used in tandem with Pandana and UrbanAccess libraries to
    extract street network nodes and edges.
  doc_url: https://udst.github.io/osmnet/
  dev_url: https://github.com/UDST/osmnet

extra:
  recipe-maintainers:
    - sablanchard
    - waddell
    - smmaurer
